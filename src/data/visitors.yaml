# 「学外の方へ」のページの文章。Sveltia CMS(管理画面)からも編集できます。
# 学生向けの案内は「研究室で学ぶ」(src/data/join.yaml)に書き、ここには学外の方に向けた内容だけを書きます。

# true にすると、公開サイトにページとメニューが表示されます。
# false の間は、公開サイトでは「準備中」の表示だけになり、メニューにも出ません(npm run dev では内容を確認できます)。
published: false

lead: "研究室の活動に関心をお持ちいただき、ありがとうございます。このページでは、学外の方に向けて、研究室としてお受けできることと、ご理解いただきたいことを、立場ごとにまとめています。"

# 立場ごとの案内。id はページ内リンク(/visitors/#id)に使うので、変えないでください。
# 各項目は省略できます。
#   welcome: お受けできること / record: これまでの活動 / decline: ご遠慮いただいていること
#   fees: 研究費用の目安の表(企業の方へ で使用)
#   links: 関連するページ(href はサイト内なら "/" から、外部なら "https://" から書く)
sections:
  - id: universities
    title: "大学・研究機関の方へ"
    lead: "共同研究を積極的に推進しています。学会や研究会などの場で、お気軽にお声がけください。"
    welcome:
      - "**共同研究:** レーザー光源の開発(狭線幅化・周波数安定化、高出力化、光周波数コムなど)や、光を使った計測・制御の技術(ライダー、干渉計測、精密分光など)に関するテーマを中心に、共同研究を歓迎します。"
      - "**競争的資金への共同での申請:** 競争的資金の獲得にも積極的に取り組んでいます。共同での申請のご相談も歓迎します。"
    links:
      - { label: "研究内容", href: "/research/" }
      - { label: "業績", href: "/publications/" }
      - { label: "メンバー(教員の経歴)", href: "/members/" }

  - id: companies
    title: "企業の方へ"
    lead: "企業の皆様との連携には、(1)学生の教育、(2)社会とのつながり、(3)研究成果の実用化という、複数の目的があります。共同研究先の皆様にも、学生の成長を温かく見守っていただけますよう、お願いしております。"
    welcome:
      - "**共同研究:** 研究室のテーマに関連する光源の開発や、光を使った計測・制御の技術について、共同で成果を生み出す研究をお受けしています。"
      - "**調査研究・技術相談:** 光源や計測に関する課題について、調査研究や技術相談をお受けしています。"
      - "**学生の技術を活かした連携:** 研究室の学生は、修士課程までの研究の中で、機械工作(3D CADによる設計、部品の試作)、電気電子回路(プリント基板の設計・製作、制御回路)、プログラミングとデータ解析、マイコン・FPGA、マイクロ波計測、光計測、ファイバー融着、真空技術を身につけます。共同研究では、学生も研究の担い手として参加します。"
    declineLead: "研究室との連携は、共同で成果を生み出すことを目的としています。そのため、次のご依頼はお受けしておりません。"
    decline:
      - "大学の研究室を、安価な外注先(下請け)とお考えの技術相談や受託研究"
    # 研究費用の目安。金額は直接経費
    fees:
      title: "研究費用(直接経費)の目安"
      groups:
        - title: "調査研究・技術相談"
          rows:
            - { price: "3万円/時間", content: "調査研究・技術相談" }
            - { price: "50万円/年", content: "月1回の進捗打ち合わせと、年度末の報告書(1回)" }
        - title: "共同研究"
          note: "期間は2年以上が望ましいと考えています。"
          rows:
            - { price: "150万円/年 以上", content: "共同研究の基本の費用。装置・部品などの調達費は別途。" }
            - { price: "+50万円/年", content: "参加する学生1人あたり" }
          includes:
            - "月1回の進捗打ち合わせ"
            - "研究会・学会での研究発表(年2回が目標)"
      notes:
        - "共同研究について、大型の競争的資金、特に社会実装に関するプログラムへの共同での応募を具体的にお約束いただける場合は、上記の限りではありません。個別にご相談ください。"
        - "共同研究の基本の費用は、教員が獲得している競争的資金の年平均をもとに算出しています。"
        - "金額は直接経費の目安です。間接経費などの扱いは、大学の規程に従います。"
    note: "教員は、企業の研究所で5年間、衛星に搭載するレーザーセンサーなどの研究開発に携わってきました。企業での研究開発の進め方を踏まえて、共同研究を進めます。"
    links:
      - { label: "研究内容", href: "/research/" }
      - { label: "身につく基幹技術(学生が身につける技術の詳細)", href: "/join/skills/" }
      - { label: "共同研究と外部機関への派遣(学生の派遣についての考え方)", href: "/join/collaboration/" }
      - { label: "業績", href: "/publications/" }

  - id: schools
    title: "小学校・中学校・高等学校の先生方へ"
    lead: "高大連携を歓迎しています。科学に意欲のある児童・生徒の皆さんが、本物の研究に触れる機会をつくるお手伝いをしたいと考えています。"
    record:
      - "スーパーサイエンスハイスクール(SSH)の高大連携事業で、学術支援のTAとして、高校の科学部の全国大会での研究発表を支援しました。"
      - "サイエンスカフェを企画・運営しました。"
      - "これらの活動により、横浜国立大学の副学長表彰を受けました。教員は、高等学校教諭第一種免許状(数学・理科)を持っています。"
    welcome:
      - "**研究の紹介を中心とした、出前授業や講演:** 光やレーザーの研究を、児童・生徒の皆さんに向けて紹介します(お申し込みは、下記のとおり大学へお問い合わせください)。"
      - "**意欲のある生徒さんへの、放課後の研究指導:** 研究発表会などでの発表を目指して、継続して研究に取り組む生徒さんを支援することが目的です。推薦入試のための一時的な活動は、お受けしていません。保険への加入など、必要な条件を満たしていただければ、受け入れられる場合があります。条件は、個別にご相談ください。"
    decline:
      - "探究学習(総合的な探究の時間など)を目的とした、生徒さんの個別の訪問やインタビュー"
      - "大学受験に向けた指導や相談"
      - "推薦入試(総合型選抜・学校推薦型選抜)のための、一時的な研究活動の受け入れ"
      - "キャリア教育・進路指導を目的とした講演会のうち、研究の紹介が中心にならないものへのご招待"
    declineLead: "研究と学生の指導に充てる時間を確保するため、次のご依頼はお受けしていません。ご理解いただけますと幸いです。"
    note: "**学校あるいは学年、学級単位の訪問、出前授業や講演については、大学へお問い合わせください。** 放課後の研究指導のご相談は、生徒さんからではなく、学校の先生から研究室へご連絡ください。"
    links:
      - { label: "日本大学 生産工学部のウェブサイト(お問い合わせ先)", href: "https://www.cit.nihon-u.ac.jp/" }

  - id: public
    title: "一般の方へ"
    lead: "研究室は、ふだんは一般の方に開放していません。オープンキャンパスなど、大学が開く行事の機会に、研究室の見学を受け入れています。"
    links:
      - { label: "日本大学 生産工学部のウェブサイト(行事の日程)", href: "https://www.cit.nihon-u.ac.jp/" }
      - { label: "研究内容(シミュレーターで、研究の考え方を体験できます)", href: "/research/" }
      - { label: "ニュース", href: "/news/" }

contactLead: "ご相談・ご依頼は、ご所属、お名前、ご用件を添えて、メールでご連絡ください。"

# 【推定】次の3か所は、いただいた内容から補って書いたものです。意図と違えば直してください。
#   (1) 先生方の「お受けできること」の1つめ(研究の紹介を中心とした出前授業や講演)。ご遠慮いただく講演会の裏返しとして書きました
#   (2) 先生方の note の後半(放課後の研究指導のご相談は学校の先生から)。生徒さんの個別の訪問をお断りしていることから補いました
#       前半の「学校あるいは学年、学級単位の訪問…大学へお問い合わせください」は先生の指示どおり。
#       大学の担当窓口(部署名)は確認できなかったため、リンクは生産工学部のウェブサイトのトップにしています
#   (3) 企業の方の「学生の技術を活かした連携」と、教員の企業での経歴の一文
#   (4) 大学の方の「共同での申請のご相談も歓迎します」。競争的資金に積極的に取り組んでいることから補いました
#   (5) 研究費用の注記「間接経費などの扱いは、大学の規程に従います」。「直接経費」と書かれていたことから補いました
# 【要確認】放課後の研究指導の条件は「保険への加入など」としか書いていません。ほかに決まっている条件(学校からの依頼、保護者の同意など)があれば足してください
# 放課後の研究指導は、研究発表会などへの支援が目的で、推薦入試のための一時的な活動は受け付けない(「ご遠慮いただいていること」にも記載)
