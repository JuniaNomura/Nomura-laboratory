# 「研究室で学ぶ」ページの内容。Sveltia CMS(管理画面)からも編集できます。
# 【要入力】と書かれた箇所を実際の内容に置き換えてください。
# 空欄にした項目(セクション)は、ページ上に表示されません。

# false の間は、公開サイトでは「準備中」の表示だけになります(npm run dev では内容を確認できます)。
# 内容がそろったら true に変更してください。
published: true

lead: "野邑研究グループは、レーザーを自分の手でつくり、そのレーザーで「測る」「操る」技術を切り開いていく研究室です。4年生のうちに自分だけのレーザーを1台開発し、修士課程ではそのレーザーを使って、自分だけの研究に取り組みます。手を動かしてモノをつくるのが好きな人、「なぜだろう？」を自分で確かめたい人、大学院まで進んで研究をやり切りたい人を歓迎します。"

# 研究の内容は「研究内容」のページで詳しく紹介しているので、ここは空にしています。
# 空のときは、導入文のすぐ下に「研究内容」ページへの案内が出ます。
whatWeDo: ""

# 研究室の1年(4月から順に書く)
# who(対象の学年): "B4" "M0" "M1" "M2" "M0以上" "M1以上" のどれか。書かなければ全員。M0は、修士進学予定の学部4年生
# kind(種類。色分けに使う): research=研究・発表 / conference=学会 / career=就職活動・インターン / exam=大学院入試 / event=行事
year:
  - month: 4
    items:
      - { text: "オリエンテーション", kind: event }
      - { text: "レーザー開発", who: "B4", kind: research }
      - { text: "就職活動", who: "M2", kind: career }
  - month: 5
    items:
      - { text: "レーザー開発", who: "B4", kind: research }
      - { text: "OJTトレーニング", kind: research }
  - month: 6
    items:
      - { text: "OJTトレーニング", who: "B4", kind: research }
      - { text: "大学院入試の勉強開始", who: "M0", kind: exam }
  - month: 7
    items:
      - { text: "大学院入試", who: "M0", kind: exam }
  - month: 8
    items:
      - { text: "夏季インターン(参加を推奨)", who: "M1", kind: career }
  - month: 9
    items:
      - { text: "応用物理学会", who: "M1以上", kind: conference }
  - month: 10
    items: []
  - month: 11
    items: []
  - month: 12
    items:
      - { text: "日本光学会", who: "M0以上", kind: conference }
  - month: 1
    items:
      - { text: "冬季インターン(参加を推奨)", who: "M1", kind: career }
      - { text: "レーザー学会", who: "M0以上", kind: conference }
  - month: 2
    items:
      - { text: "卒研発表", who: "B4", kind: research }
      - { text: "修論発表", who: "M2", kind: research }
      - { text: "学術論文執筆", who: "M2", kind: research }
      - { text: "就職活動", who: "M1", kind: career }
  - month: 3
    items:
      - { text: "応用物理学会", who: "M0以上", kind: conference }
      - { text: "就職活動", who: "M1", kind: career }

# よくある質問
# よくある質問
# a: 教員からの回答 / guides: 関連する「詳しく知る」のページ(ファイル名。公開されているページだけリンクが出る)
# voices: 先輩たちの声。1人1項目で、text(本文)と who(学年など。例: "B4" "M1")を書く。
#         空のあいだは、公開サイトには何も表示されない(開発サーバーでは「集計中」と表示される)
faq:
  - q: "事前に必要な知識やスキルはありますか？"
    a: "研究に必要な知識や技術の多くは、研究室に入ってから、研究を進めながら身につけていきます。今の時点で専門的な知識がなくても、心配はいりません。一方で、図や表、式、グラフを用いて話し合ったり、わからないことを自分から相談できる力(科学的コミュニケーション力)は、ある程度身につけておいてほしいと思います。この力がないと、教員や先輩が指導することも、仲間と学び合うことも難しくなるからです。"
    guides: ["policy"]
    voices: []
  - q: "どれくらいプログラミング能力が必要ですか？"
    a: "研究室で使うプログラミング言語は、Pythonが中心です。生成AIの助けを借りながら、研究の中で学んでいけば大丈夫です。大学の授業で習った内容を思い出せれば、始めるには十分すぎるほどです。"
    guides: ["skills"]
    voices: []
  - q: "就職活動と研究は両立できますか？"
    a: "研究と就職活動をどう両立するか、研究室としての考え方は「進路と就職活動」のページにまとめています。実際のところは、先輩たちの声を参考にしてください。"
    guides: ["career"]
    voices: []
  - q: "どれくらい研究室に来ないといけませんか？"
    a: "「コアタイムと研究室での過ごし方」にあるとおり、研究室では、学生が毎日来ることを前提に指導しています。ただ、実際には授業やアルバイトなどもあるので、研究室にいる時間は人によって違います。先輩たちがどのくらい研究室に来ているかは、先輩たちの声を参考にしてください。"
    guides: ["coretime"]
    voices: []
