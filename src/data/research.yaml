# 「研究内容」ページの見出し・導入文。Sveltia CMS(管理画面)からも編集できます。
# 研究テーマ本体は src/content/themes/ の Markdown(1テーマ=1ファイル)です。

# 研究室全体の導入文と脚注(強靭性の説明)は、トップページと共通なので src/data/lab.yaml に書きます。
# ここの lead は、共通の導入文に続けて、研究内容のページの冒頭にだけ出す文です。
lead: "「光を創る」研究で新しいレーザーを開発し、そのレーザーを「光で測る」「光で操る」研究へと広げていきます。下では、3つの軸ごとに研究テーマを紹介しています。「シミュレーターあり」のテーマでは、研究の考え方を自分で動かして確かめられます。"

axes:
  create:
    title: "光を創る"
    lead: "半導体レーザーから放出される光エネルギーを起点として、最先端の研究に活用できる特殊なレーザーを中心に開発しています。開発したレーザーは、「測る」「操る」研究へ適用していきます。"
    note: "修士進学希望の学生は、4年生のうちに1台、自分だけの「世界に一台の」レーザーを開発して、そのレーザーで修士課程で独自の研究を遂行していきます。"
  measure:
    title: "光で測る"
    lead: "光を用いて、ターゲットの物理的な特性や挙動を測定する技術を開発しています。"
  control:
    title: "光で操る"
    lead: "光を用いて、ターゲットの物理的な特性や挙動を変化・制御させる技術を開発しています。"

outreach: "その他にも、アウトリーチ活動で利用できるような、可搬型のレーザー実験装置の開発にも興味があります。教職を目指す学生の方、一緒にどうでしょうか？"
